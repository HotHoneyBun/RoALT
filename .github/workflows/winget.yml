name: Winget

# When a release is published, proposes it to the Windows Package Manager. Does nothing until the
# WINGET_TOKEN secret is set (a GitHub token with public_repo, on an account with a fork of
# microsoft/winget-pkgs); the first version of inspectsoftware.RoALT must be submitted by hand.
on:
  release:
    types: [released]

# The job needs no GITHUB_TOKEN rights: it acts with WINGET_TOKEN only.
permissions: {}

jobs:
  publish:
    runs-on: windows-latest
    env:
      HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: Skipped without WINGET_TOKEN
        if: env.HAS_TOKEN != 'true'
        run: echo "WINGET_TOKEN isn't set; not publishing to winget."
      # Pinned to a commit (v2, 2026-10-07): a moving branch must not receive WINGET_TOKEN.
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        if: env.HAS_TOKEN == 'true'
        with:
          identifier: inspectsoftware.RoALT
          installers-regex: 'RoALT-Setup-.*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
